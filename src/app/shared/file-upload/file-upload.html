<div
  class="fu"
  [class.fu--drag]="dragging()"
  [class.fu--invalid]="invalid()"
  [class.fu--disabled]="disabled()"
  [class.fu--filled]="!!preview()"
  role="button"
  tabindex="0"
  (click)="openPicker()"
  (keydown.enter)="openPicker()"
  (keydown.space)="openPicker(); $event.preventDefault()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    #fileInput
    type="file"
    class="fu__input"
    [accept]="accept()"
    [attr.capture]="capture()"
    [disabled]="disabled()"
    (change)="onInput($event)"
  />

  @if (preview(); as src) {
    <div class="fu__preview">
      <img class="fu__thumb" [src]="src" alt="معاينة" />
      <div class="fu__meta">
        <span class="fu__name">{{ fileName() ?? 'الصورة الحالية' }}</span>
        <span class="fu__change">اضغط للتغيير</span>
      </div>
      <button
        type="button"
        class="fu__remove"
        (click)="clear($event)"
        aria-label="إزالة الصورة"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  } @else {
    <div class="fu__empty">
      <span class="fu__icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 16V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <p class="fu__label">{{ label() }}</p>
      <p class="fu__hint">{{ hint() }}</p>
    </div>
  }
</div>
